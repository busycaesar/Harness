<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent Monitor</title>
<style>
:root {
  color-scheme: light;
  --bg: #eceff0;
  --surface: #f7f9f9;
  --surface-quiet: #e3e8e9;
  --line: #c9d1d3;
  --line-soft: #d9dfe0;
  --ink: #14201f;
  --ink-2: #44565a;
  --ink-3: #566a6e;
  --lost-bg: #f7d9d6;
  --lost-ink: #9c1f17;
  --busy-bg: #d0eddb;
  --busy-ink: #0f5c33;
  --waiting-bg: #f8e3bd;
  --waiting-ink: #7a4f05;
  --idle-bg: #dbe1e2;
  --idle-ink: #3f5154;
  --focus: #1a56a8;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --page-texture: none;
  --step--1: 0.75rem;
  --step-0: 0.8125rem;
  --step-1: 0.9375rem;
  --box-width: 15rem;
  --box-gap: 0.75rem;
  --dismiss-gutter: 1.65rem;
  --rail-lane: 1rem;
  --drop-inset: 1rem;
  --connector-drop: 0.9rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --surface: #0a100e;
    --surface-quiet: #060a06;
    --line: #1f6c1b;
    --line-soft: #154412;
    --ink: #16c60c;
    --ink-2: #14a40c;
    --ink-3: #179110;
    --lost-bg: #3a0f0c;
    --lost-ink: #ff9f93;
    --busy-bg: #092707;
    --busy-ink: #16c60c;
    --waiting-bg: #2b2209;
    --waiting-ink: #f5cf7d;
    --idle-bg: #0f1a0f;
    --idle-ink: #a2db9f;
    --focus: #48ff3d;
    --sans: var(--mono);
    --page-texture: repeating-linear-gradient(to bottom, rgba(22, 198, 12, 0.009) 0 1px, rgba(22, 198, 12, 0) 1px 3px);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --surface: #0a100e;
  --surface-quiet: #060a06;
  --line: #1f6c1b;
  --line-soft: #154412;
  --ink: #16c60c;
  --ink-2: #14a40c;
  --ink-3: #179110;
  --lost-bg: #3a0f0c;
  --lost-ink: #ff9f93;
  --busy-bg: #092707;
  --busy-ink: #16c60c;
  --waiting-bg: #2b2209;
  --waiting-ink: #f5cf7d;
  --idle-bg: #0f1a0f;
  --idle-ink: #a2db9f;
  --focus: #48ff3d;
  --sans: var(--mono);
  --page-texture: repeating-linear-gradient(to bottom, rgba(22, 198, 12, 0.009) 0 1px, rgba(22, 198, 12, 0) 1px 3px);
}

*, *::before, *::after { box-sizing: border-box; }
/* a reserved gutter keeps the page width the same whether or not the scrollbar is showing */
html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--page-texture);
  color: var(--ink);
  font: 400 var(--step-0)/1.45 var(--sans);
  overflow-x: hidden;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.page { max-width: 94rem; margin: 0 auto; padding: 1.5rem 2.5rem 3.5rem; }

.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; min-height: 2.25rem; margin: 0 0 1.25rem; }
.topbar select {
  margin-left: auto;
  font: 500 var(--step-0)/1.2 var(--sans);
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.35rem 0.5rem;
  min-height: 2.25rem;
  max-width: 100%;
}
.stream-lost {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.1rem 0.5rem 0.1rem 0.4rem;
  border-radius: 3px;
  background: var(--lost-bg);
  color: var(--lost-ink);
  font: 600 var(--step-0)/1.4 var(--sans);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.stream-lost::before { content: ""; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: no-preference) {
  .stream-lost::before { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
}

.sessions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
}
.session {
  min-width: 0;
  padding: 1rem 1.1rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-quiet);
}
/* wrapping lets a long goal push the status onto its own line instead of crowding it at narrow widths */
.session-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.4rem 1rem;
  margin: 0 0 0.9rem;
  padding-bottom: 0.65rem;
  border-bottom: 1px solid var(--line-soft);
}
.session-goal {
  flex: 1 1 11rem;
  min-width: 0;
  margin: 0;
  color: var(--ink-3);
  font: 500 var(--step--1)/1.45 var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.session-status {
  flex: 0 1 auto;
  min-width: 0;
  margin: 0 0 0 auto;
  display: inline-flex;
  align-items: baseline;
  gap: 0.4rem;
  max-width: 100%;
  padding: 0.1rem 0.5rem 0.1rem 0.4rem;
  border-radius: 3px;
  font: 600 var(--step--1)/1.4 var(--sans);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.session-status::before {
  content: "";
  flex: none;
  align-self: center;
  width: 0.4rem;
  height: 0.4rem;
  border-radius: 50%;
  background: currentColor;
}
.session-status.busy { background: var(--busy-bg); color: var(--busy-ink); }
.session-status.waiting { background: var(--waiting-bg); color: var(--waiting-ink); }
.session-status.idle { background: var(--idle-bg); color: var(--idle-ink); }
.status-label { flex: none; }
.status-reason { min-width: 0; font-weight: 500; letter-spacing: 0.02em; text-transform: none; }
.status-reason::before { content: "· "; }
@media (prefers-reduced-motion: no-preference) {
  .session-status.busy::before { animation: pulse 1.6s ease-in-out infinite; }
}
.tasks {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1.4rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.task { min-width: 0; }
.tasks-empty {
  display: flex;
  align-items: center;
  min-height: var(--box-height, 4rem);
  margin: 0;
  padding: 0 0 0 0.75rem;
  border-left: 1px dashed var(--line-soft);
  color: var(--ink-3);
  font-size: var(--step--1);
  letter-spacing: 0.04em;
}

.box {
  position: relative;
  display: flex;
  width: var(--box-width);
  max-width: 100%;
  height: var(--box-height, auto);
  padding: 0.5rem 0.75rem 0.55rem;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: var(--surface);
}
.main-box { padding-left: var(--dismiss-gutter); border-color: var(--line); }
.box-text { flex: 1; min-height: 0; margin: 0; overflow-y: auto; overflow-wrap: anywhere; }
.main-box .box-text { font-weight: 600; }
/* heights are read while every box is back at its natural size, so one pass of reads never sees a height this code just wrote */
.measuring .box { height: auto; }
.measuring .box-text { overflow-y: visible; }
.box-dismiss {
  position: absolute;
  top: 0.25rem;
  left: 0.3rem;
  display: grid;
  place-items: center;
  width: 1.2rem;
  height: 1.2rem;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: none;
  color: var(--ink-3);
  font: 400 var(--step-1)/1 var(--mono);
  cursor: pointer;
}
.box-dismiss:hover { color: var(--ink); }
.active-box { padding-left: var(--dismiss-gutter); }
/* absolute keeps the dot out of the flex flow, so it changes neither the width nor the measured height */
.active-box::before {
  content: "";
  position: absolute;
  top: 0.65rem;
  left: 0.7rem;
  width: 0.4rem;
  height: 0.4rem;
  border-radius: 50%;
  background: var(--ink-2);
}
@media (prefers-reduced-motion: no-preference) {
  .active-box::before { animation: pulse 1.6s ease-in-out infinite; }
}

.helpers {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: var(--box-gap);
  margin: var(--connector-drop) 0 0;
  padding: 0 0 0 calc(var(--rail-lane) + var(--box-gap));
  list-style: none;
}
/* the lane rises into the margin above to meet the bottom of the box these helpers hang from; it is a bare
   stem for a single row, and reaches down to the last wrapped row's rail when the helpers wrap */
.helpers::before {
  content: "";
  position: absolute;
  left: var(--rail-lane);
  top: calc(-1 * var(--connector-drop));
  height: calc(var(--connector-drop) + var(--rail-span, 0px));
  border-left: 1px solid var(--line);
}
.helper {
  position: relative;
  min-width: 0;
  max-width: 100%;
  padding-top: var(--connector-drop);
}
/* one rail per row, owned by the row's first helper: it starts on the lane and stops at the last drop in the
   row, so a lone helper gets a bare elbow and no row ever trails a line past its final child */
.helper.row-start::before {
  content: "";
  position: absolute;
  top: 0;
  left: calc(-1 * var(--box-gap));
  width: calc(var(--box-gap) + var(--rail-run, 0px) + var(--drop-inset));
  border-top: 1px solid var(--line);
}
.helper::after {
  content: "";
  position: absolute;
  top: 0;
  left: var(--drop-inset);
  height: var(--connector-drop);
  border-left: 1px solid var(--line);
}

.notice:empty { display: none; }
.empty { padding: 2.5rem 1rem; color: var(--ink-2); font-size: var(--step-1); }

@media (max-width: 40rem) {
  .page { padding: 0.75rem 0.75rem 2rem; }
  .topbar select { margin-left: 0; width: 100%; }
  .session { padding: 0.85rem 0.7rem 1rem; }
}

@media (prefers-reduced-motion: reduce) {
  body { background-image: none; }
  .stream-lost::before { animation: none; }
  .active-box::before { animation: none; }
  .session-status.busy::before { animation: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="notice" id="notice" role="status"></div>
    <select id="project" aria-label="Project"></select>
  </div>
  <main class="sessions" id="sessions"></main>
</div>

<script>
"use strict";

const PROJECT_STORAGE_KEY = "agent-monitor.project";
const DISMISSED_STORAGE_KEY = "agent-monitor.dismissed";
const FIXTURE_URLS = ["/fixtures/snapshot.json", "../fixtures/snapshot.json"];
const RECONNECT_DELAY_MS = 3000;
const STATUS_ORDER = { waiting: 0, busy: 1, idle: 2 };
const STATUS_LABELS = { waiting: "Waiting", busy: "Busy", idle: "Idle" };
const WAITING_STATUS = "waiting";
const FINISHED_STATE = "finished";
const MAIN_BOX_PARENT = null;
const MEASURING_CLASS = "measuring";
const ACTIVE_BOX_CLASS = "active-box";
const ROW_START_CLASS = "row-start";
const BOX_HEIGHT_PROPERTY = "--box-height";
const RAIL_RUN_PROPERTY = "--rail-run";
const RAIL_SPAN_PROPERTY = "--rail-span";
const NO_FRAME = 0;

const projectSelect = document.getElementById("project");
const notice = document.getElementById("notice");
const sessionList = document.getElementById("sessions");

const fixtureMode = new URLSearchParams(location.search).has("fixture");
const dismissedTasks = readDismissedTasks();
let snapshot = null;
let streamLost = false;
let pendingResizeFrame = NO_FRAME;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function readSavedProject() {
  // localStorage throws in some sandboxed contexts; the default project is a fine substitute
  try {
    return localStorage.getItem(PROJECT_STORAGE_KEY);
  } catch (error) {
    return null;
  }
}

function saveProject(cwd) {
  try {
    localStorage.setItem(PROJECT_STORAGE_KEY, cwd);
  } catch (error) {
    console.warn("Could not remember project choice", error);
  }
}

// a task id is unique only inside its own session, so dismissals are stored per session id
function readDismissedTasks() {
  try {
    const stored = localStorage.getItem(DISMISSED_STORAGE_KEY);
    if (stored === null) return new Map();
    const taskIdsBySession = Object.entries(JSON.parse(stored));
    return new Map(taskIdsBySession.map(([sessionId, taskIds]) => [sessionId, new Set(taskIds)]));
  } catch (error) {
    console.warn("Could not read dismissed tasks; showing every finished task", error);
    return new Map();
  }
}

function saveDismissedTasks() {
  try {
    const entries = [...dismissedTasks].map(([sessionId, taskIds]) => [sessionId, [...taskIds]]);
    localStorage.setItem(DISMISSED_STORAGE_KEY, JSON.stringify(Object.fromEntries(entries)));
  } catch (error) {
    console.warn("Could not remember dismissed tasks", error);
  }
}

function dismissTask(sessionId, taskId) {
  const taskIds = dismissedTasks.get(sessionId) ?? new Set();
  taskIds.add(taskId);
  dismissedTasks.set(sessionId, taskIds);
  saveDismissedTasks();
  render();
}

function pruneDismissedTasks(sessions) {
  const knownSessionIds = new Set(sessions.map((session) => session.sessionId));
  const goneSessionIds = [...dismissedTasks.keys()].filter((sessionId) => !knownSessionIds.has(sessionId));
  if (goneSessionIds.length === 0) return;
  for (const sessionId of goneSessionIds) dismissedTasks.delete(sessionId);
  saveDismissedTasks();
}

function buildDismissButton(task, sessionId) {
  const button = el("button", "box-dismiss", "×");
  button.type = "button";
  button.setAttribute("aria-label", `Dismiss finished task: ${task.title}`);
  button.addEventListener("click", () => dismissTask(sessionId, task.taskId));
  return button;
}

function buildBox(className, text) {
  const box = el("div", className);
  box.append(el("p", "box-text", text));
  return box;
}

function buildMainBox(task, sessionId) {
  if (task.main.state !== FINISHED_STATE) return buildBox(`box main-box ${ACTIVE_BOX_CLASS}`, task.title);
  const box = buildBox("box main-box", task.title);
  box.prepend(buildDismissButton(task, sessionId));
  return box;
}

function helpersByParent(helpers) {
  const byParent = new Map();
  for (const helper of helpers) {
    const siblings = byParent.get(helper.parentAgentId) || [];
    siblings.push(helper);
    byParent.set(helper.parentAgentId, siblings);
  }
  return byParent;
}

function buildHelperList(helpers, byParent) {
  const list = el("ul", "helpers");
  list.append(...helpers.map((helper) => buildHelper(helper, byParent)));
  return list;
}

function buildHelper(helper, byParent) {
  const item = el("li", "helper");
  item.append(buildBox(`box helper-box ${ACTIVE_BOX_CLASS}`, helper.description));
  const children = byParent.get(helper.agentId);
  if (children) item.append(buildHelperList(children, byParent));
  return item;
}

function activeHelpers(agents) {
  return agents.filter((agent) => agent.state !== FINISHED_STATE);
}

function buildTask(task, sessionId) {
  const item = el("li", "task");
  item.append(buildMainBox(task, sessionId));
  const byParent = helpersByParent(activeHelpers(task.agents));
  const directHelpers = byParent.get(MAIN_BOX_PARENT);
  if (directHelpers) item.append(buildHelperList(directHelpers, byParent));
  return item;
}

function isShown(task, sessionId) {
  if (dismissedTasks.get(sessionId)?.has(task.taskId)) return false;
  return typeof task.title === "string" && task.title.trim() !== "";
}

function buildTaskList(tasks, sessionId) {
  if (tasks.length === 0) return el("p", "tasks-empty", "No tasks yet");
  const list = el("ol", "tasks");
  list.append(...tasks.map((task) => buildTask(task, sessionId)));
  return list;
}

function buildSessionStatus(session) {
  const status = el("p", `session-status ${session.status}`);
  status.append(el("span", "status-label", STATUS_LABELS[session.status]));
  if (session.status === WAITING_STATUS && session.waitingFor !== null) {
    status.append(el("span", "status-reason", session.waitingFor));
  }
  return status;
}

function buildSessionHead(session) {
  const head = el("div", "session-head");
  if (session.goal) head.append(el("h2", "session-goal", session.goal));
  head.append(buildSessionStatus(session));
  return head;
}

function buildSessionRegion(session) {
  const region = el("section", "session");
  region.append(buildSessionHead(session));
  const shownTasks = session.tasks.filter((task) => isShown(task, session.sessionId));
  region.append(buildTaskList(shownTasks, session.sessionId));
  return region;
}

function compareSessions(first, second) {
  if (first.status !== second.status) return STATUS_ORDER[first.status] - STATUS_ORDER[second.status];
  return second.startedAt - first.startedAt;
}

function pickDefaultProject(projects) {
  return projects.reduce((best, project) => (project.liveSessions > best.liveSessions ? project : best));
}

function selectedProject() {
  const projects = snapshot.projects;
  if (projects.length === 0) return null;
  const saved = projects.find((project) => project.cwd === readSavedProject());
  return saved ?? pickDefaultProject(projects);
}

function syncProjectOptions(project) {
  const signature = snapshot.projects.map((entry) => `${entry.cwd}|${entry.name}|${entry.liveSessions}`).join("\n");
  if (projectSelect.dataset.signature !== signature) {
    projectSelect.dataset.signature = signature;
    projectSelect.replaceChildren(
      ...snapshot.projects.map((entry) => {
        const option = el("option", "", `${entry.name} (${entry.liveSessions} live)`);
        option.value = entry.cwd;
        option.title = entry.cwd;
        return option;
      })
    );
  }
  projectSelect.value = project ? project.cwd : "";
  projectSelect.disabled = !project;
}

function countStatus(sessions, status) {
  return sessions.filter((session) => session.status === status).length;
}

function titlePrefix(counts) {
  if (streamLost) return "(stream lost) ";
  if (counts.waiting > 0) return `(${counts.waiting} waiting) `;
  if (counts.busy > 0) return `(${counts.busy} busy) `;
  return "";
}

function renderTitle(project, counts) {
  document.title = project ? `${titlePrefix(counts)}${project.name}` : "Agent Monitor";
}

function renderNotice() {
  notice.replaceChildren();
  if (streamLost) notice.append(el("span", "stream-lost", "Stream lost, retrying"));
}

function renderEmpty(message) {
  sessionList.replaceChildren(el("div", "empty", message));
}

function renderSessions() {
  if (!snapshot) {
    document.title = streamLost ? "(stream lost) Agent Monitor" : "Agent Monitor";
    renderEmpty("Waiting for the first snapshot");
    return;
  }
  pruneDismissedTasks(snapshot.sessions);
  const project = selectedProject();
  syncProjectOptions(project);
  const sessions = project
    ? snapshot.sessions.filter((session) => session.project === project.name).sort(compareSessions)
    : [];
  renderTitle(project, { waiting: countStatus(sessions, "waiting"), busy: countStatus(sessions, "busy") });
  if (sessions.length === 0) {
    renderEmpty("No live sessions for this project");
    return;
  }
  sessionList.replaceChildren(...sessions.map(buildSessionRegion));
}

function naturalBoxHeights() {
  sessionList.classList.add(MEASURING_CLASS);
  const heights = [...sessionList.querySelectorAll(".box")].map((box) => box.getBoundingClientRect().height);
  sessionList.classList.remove(MEASURING_CLASS);
  return heights;
}

function applyUniformBoxHeight() {
  const heights = naturalBoxHeights();
  if (heights.length === 0) {
    sessionList.style.removeProperty(BOX_HEIGHT_PROPERTY);
    return;
  }
  sessionList.style.setProperty(BOX_HEIGHT_PROPERTY, `${Math.ceil(Math.max(...heights))}px`);
}

function helperRows(list) {
  const rowsByTop = new Map();
  for (const helper of list.children) {
    const top = Math.round(helper.getBoundingClientRect().top);
    const row = rowsByTop.get(top) ?? [];
    row.push(helper);
    rowsByTop.set(top, row);
  }
  return [...rowsByTop.values()];
}

function clearRails(list) {
  for (const helper of list.children) {
    helper.classList.remove(ROW_START_CLASS);
    helper.style.removeProperty(RAIL_RUN_PROPERTY);
  }
}

function applyRail(row) {
  const rowStart = row[0];
  const rowEnd = row[row.length - 1];
  const run = rowEnd.getBoundingClientRect().left - rowStart.getBoundingClientRect().left;
  rowStart.classList.add(ROW_START_CLASS);
  rowStart.style.setProperty(RAIL_RUN_PROPERTY, `${Math.round(run)}px`);
}

function applyLaneHeight(list, rows) {
  const lastRowTop = rows[rows.length - 1][0].getBoundingClientRect().top;
  list.style.setProperty(RAIL_SPAN_PROPERTY, `${Math.round(lastRowTop - list.getBoundingClientRect().top)}px`);
}

function applyConnectorGeometry() {
  for (const list of sessionList.querySelectorAll(".helpers")) {
    clearRails(list);
    const rows = helperRows(list);
    rows.forEach(applyRail);
    applyLaneHeight(list, rows);
  }
}

function fitBoxesAndConnectors() {
  applyUniformBoxHeight();
  applyConnectorGeometry();
}

function remeasureOnResize() {
  if (pendingResizeFrame !== NO_FRAME) return;
  pendingResizeFrame = requestAnimationFrame(() => {
    pendingResizeFrame = NO_FRAME;
    fitBoxesAndConnectors();
  });
}

function render() {
  renderNotice();
  renderSessions();
  fitBoxesAndConnectors();
}

function validateSnapshot(candidate) {
  const valid = candidate && Array.isArray(candidate.projects) && Array.isArray(candidate.sessions)
    && typeof candidate.generatedAt === "number";
  if (!valid) throw new Error("Snapshot is missing generatedAt, projects or sessions");
  return candidate;
}

function applySnapshot(candidate) {
  snapshot = validateSnapshot(candidate);
  render();
}

function reportProblem(message, error) {
  console.error(message, error);
  renderEmpty(message);
}

function connectStream() {
  const source = new EventSource("/events");
  source.onopen = () => {
    streamLost = false;
    render();
  };
  source.onmessage = (event) => {
    streamLost = false;
    try {
      applySnapshot(JSON.parse(event.data));
    } catch (error) {
      reportProblem("Received a snapshot the page cannot read", error);
    }
  };
  source.onerror = () => {
    streamLost = true;
    render();
    if (source.readyState === EventSource.CLOSED) {
      source.close();
      setTimeout(connectStream, RECONNECT_DELAY_MS);
    }
  };
}

async function fetchFixture() {
  for (const url of FIXTURE_URLS) {
    try {
      const response = await fetch(url);
      if (response.ok) return await response.json();
    } catch (error) {
      console.warn(`Fixture not reachable at ${url}`, error);
    }
  }
  throw new Error("Fixture mode needs the server: could not load /fixtures/snapshot.json");
}

projectSelect.addEventListener("change", () => {
  saveProject(projectSelect.value);
  render();
});

window.addEventListener("resize", remeasureOnResize);

render();

if (fixtureMode) {
  fetchFixture().then(applySnapshot).catch((error) => reportProblem(error.message, error));
} else {
  connectStream();
}
</script>
</body>
