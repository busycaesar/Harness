<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent Monitor</title>
<style>
:root {
  color-scheme: light;
  --bg: #eceff0;
  --surface: #f7f9f9;
  --surface-quiet: #e3e8e9;
  --line: #c9d1d3;
  --line-soft: #d9dfe0;
  --ink: #14201f;
  --ink-2: #44565a;
  --ink-3: #566a6e;
  --busy-bg: #d0eddb;
  --busy-ink: #0f5c33;
  --waiting-bg: #f8e3bd;
  --waiting-ink: #7a4f05;
  --idle-bg: #dbe1e2;
  --idle-ink: #3f5154;
  --lost-bg: #f7d9d6;
  --lost-ink: #9c1f17;
  --focus: #1a56a8;
  --series-input: #2a78d6;
  --series-output: #eb6834;
  --series-cache-read: #1baf7a;
  --series-cache-write: #eda100;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --page-texture: none;
  --live-glow: none;
  --live-halo: none;
  --step--1: 0.75rem;
  --step-0: 0.8125rem;
  --step-1: 0.9375rem;
  --step-2: 1.25rem;
  --session-track: 22rem;
  --family-gap: 1.75rem;
  --agent-track: 14rem;
  --agent-row: 10.5rem;
  --agent-gap: 0.6rem;
  --kin-indent: 1.4rem;
  --kin-max-height: 34rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --surface: #0a100e;
    --surface-quiet: #070b07;
    --line: #1f6c1b;
    --line-soft: #154412;
    --ink: #16c60c;
    --ink-2: #14a40c;
    --ink-3: #179110;
    --busy-bg: #092707;
    --busy-ink: #16c60c;
    --waiting-bg: #2b2209;
    --waiting-ink: #f5cf7d;
    --idle-bg: #0f1a0f;
    --idle-ink: #a2db9f;
    --lost-bg: #3a0f0c;
    --lost-ink: #ff9f93;
    --focus: #48ff3d;
    --series-input: #3987e5;
    --series-output: #d95926;
    --series-cache-read: #199e70;
    --series-cache-write: #c98500;
    --sans: var(--mono);
    --page-texture: repeating-linear-gradient(to bottom, rgba(22, 198, 12, 0.009) 0 1px, rgba(22, 198, 12, 0) 1px 3px);
    --live-glow: 0 0 7px rgba(22, 198, 12, 0.5);
    --live-halo: 0 0 10px -2px rgba(22, 198, 12, 0.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --surface: #0a100e;
  --surface-quiet: #070b07;
  --line: #1f6c1b;
  --line-soft: #154412;
  --ink: #16c60c;
  --ink-2: #14a40c;
  --ink-3: #179110;
  --busy-bg: #092707;
  --busy-ink: #16c60c;
  --waiting-bg: #2b2209;
  --waiting-ink: #f5cf7d;
  --idle-bg: #0f1a0f;
  --idle-ink: #a2db9f;
  --lost-bg: #3a0f0c;
  --lost-ink: #ff9f93;
  --focus: #48ff3d;
  --series-input: #3987e5;
  --series-output: #d95926;
  --series-cache-read: #199e70;
  --series-cache-write: #c98500;
  --sans: var(--mono);
  --page-texture: repeating-linear-gradient(to bottom, rgba(22, 198, 12, 0.009) 0 1px, rgba(22, 198, 12, 0) 1px 3px);
  --live-glow: 0 0 7px rgba(22, 198, 12, 0.5);
  --live-halo: 0 0 10px -2px rgba(22, 198, 12, 0.45);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--page-texture);
  color: var(--ink);
  font: 400 var(--step-0)/1.45 var(--sans);
  overflow-x: hidden;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.page { max-width: 94rem; margin: 0 auto; padding: 1.5rem 2.5rem 3.5rem; }

.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; min-height: 2.25rem; margin: 0 0 1.25rem; }
.topbar select {
  margin-left: auto;
  font: 500 var(--step-0)/1.2 var(--sans);
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.35rem 0.5rem;
  min-height: 2.25rem;
  max-width: 100%;
}
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.1rem 0.5rem 0.1rem 0.4rem;
  border-radius: 3px;
  font: 600 var(--step--1)/1.4 var(--sans);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
  flex: none;
}
.chip::before { content: ""; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: currentColor; }
.chip.busy { background: var(--busy-bg); color: var(--busy-ink); }
.chip.waiting { background: var(--waiting-bg); color: var(--waiting-ink); }
.chip.idle { background: var(--idle-bg); color: var(--idle-ink); }
.chip.active { background: var(--busy-bg); color: var(--busy-ink); }
.chip.lost { background: var(--lost-bg); color: var(--lost-ink); font-size: var(--step-0); }
.chip.busy, .chip.active { text-shadow: var(--live-glow); box-shadow: var(--live-halo); }
@media (prefers-reduced-motion: no-preference) {
  .chip.busy::before, .chip.active::before { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
}

.chart { display: block; width: 100%; max-width: 100%; height: auto; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .edge { stroke: var(--line-soft); stroke-width: 1; }
.chart .name { fill: var(--ink-3); font: 400 11px var(--sans); }
.chart .figure { fill: var(--ink); font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
.bar.input { fill: var(--series-input); }
.bar.output { fill: var(--series-output); }
.bar.cache-read { fill: var(--series-cache-read); }
.bar.cache-write { fill: var(--series-cache-write); }
.bar.total { fill: var(--ink-2); }

.session-spark { max-width: 20rem; }
.kind-bars { max-width: 17rem; }
.spark-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark-dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.spark-single { margin: 0; color: var(--ink-2); font-size: var(--step--1); }
.spark-single b { color: var(--ink); font: 600 var(--step-0)/1 var(--mono); font-variant-numeric: tabular-nums; }
.chart-empty { margin: 0; padding: 0.2rem 0; color: var(--ink-3); font-size: var(--step--1); }

.chart-block { margin: 0.6rem 0 0; padding: 0.5rem 0 0; border-top: 1px solid var(--line-soft); }
.chart-note { margin: 0 0 0.3rem; color: var(--ink-3); font-size: var(--step--1); line-height: 1.35; }
.chart-note + .chart-note { margin-top: 0.5rem; }

.compare { margin: 0.6rem 0 0; }
.compare-head { margin: 0 0 0.2rem; color: var(--ink-3); font-size: var(--step--1); letter-spacing: 0.04em; text-transform: uppercase; }
.compare .chart { max-width: 17rem; }

.sessions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 1.75rem 1.5rem; }
.family { min-width: 0; }
.family.has-kin {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: var(--session-track) minmax(0, 1fr);
  align-items: start;
  gap: 0 var(--family-gap);
}
.session { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); min-width: 0; overflow: hidden; }
.session-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.75rem; padding: 0.7rem 0.9rem 0.25rem; }
.session-name { font-size: var(--step-1); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary { font: 400 var(--step-0)/1.3 var(--mono); color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-head .summary { flex: 1 1 auto; }
.waiting-for { font: 500 var(--step-0)/1.3 var(--mono); color: var(--waiting-ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.running { margin-left: auto; font: 400 var(--step-0)/1.3 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.running b { color: var(--busy-ink); font-weight: 600; }
.session-body { padding: 0.1rem 0.9rem 0.8rem; }
.facts { display: flex; flex-wrap: wrap; gap: 0.15rem 1.25rem; margin: 0 0 0.4rem; padding: 0; list-style: none; color: var(--ink-3); }
.facts li { min-width: 0; }
.facts .value { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.tokens { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: 0.2rem 1.25rem; margin: 0; }
.token { display: flex; flex-direction: column; min-width: 0; }
.token dt { color: var(--ink-3); font-size: var(--step--1); letter-spacing: 0.04em; text-transform: uppercase; }
.token dd { margin: 0; font: 500 var(--step-1)/1.25 var(--mono); font-variant-numeric: tabular-nums; }

.kin { position: relative; min-width: 0; }
.kin::before { content: ""; position: absolute; left: calc(-1 * var(--family-gap)); top: 0; width: calc(var(--family-gap) + 1px); border-top: 1px solid var(--line); }
.kin-scroll {
  max-height: var(--kin-max-height);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.kin-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fill, var(--agent-track));
  grid-auto-rows: var(--agent-row);
  gap: var(--agent-gap);
  margin: 0;
  padding: 0 0 0 var(--kin-indent);
  list-style: none;
}
/* the spine plus one elbow per wrapped row: the rows are a fixed height, so a repeating gradient lands an elbow on every row and on no row that is not there */
.kin-grid::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: var(--kin-indent);
  border-left: 1px solid var(--line);
  background-clip: content-box;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(var(--agent-row) / 2),
    var(--line) calc(var(--agent-row) / 2),
    var(--line) calc(var(--agent-row) / 2 + 1px),
    transparent calc(var(--agent-row) / 2 + 1px),
    transparent calc(var(--agent-row) + var(--agent-gap))
  );
}

.agent-card {
  padding: 0.45rem 0.7rem 0.6rem;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: var(--surface);
  min-width: 0;
  overflow: hidden;
}
.agent-top { display: flex; align-items: center; gap: 0.3rem 0.5rem; }
.agent-type { font: 600 var(--step-0)/1.3 var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-depth { color: var(--ink-3); font: 400 var(--step--1)/1.4 var(--mono); flex: none; }
.agent-desc {
  margin: 0.2rem 0 0; color: var(--ink-2);
  display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; line-clamp: 2;
  overflow: hidden;
}
.agent-meta { display: flex; flex-wrap: wrap; gap: 0.1rem 0.75rem; margin: 0.2rem 0 0; color: var(--ink-3); font: 400 var(--step--1)/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.agent-meta .summary { font-size: var(--step--1); color: var(--ink-2); max-width: 100%; }
.agent-total { margin: 0.3rem 0 0.2rem; color: var(--ink-3); font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-total b { color: var(--ink); font: 600 var(--step-0)/1 var(--mono); font-variant-numeric: tabular-nums; }

.notice:empty { display: none; }
.empty { padding: 2.5rem 1rem; color: var(--ink-2); font-size: var(--step-1); }

@media (max-width: 64rem) {
  .sessions { grid-template-columns: 1fr; }
  .family.has-kin { grid-template-columns: 1fr; gap: 0; }
  .kin { padding-top: 1.1rem; }
  .kin::before { left: 1.1rem; top: 0; width: 0; height: 1.1rem; border-top: 0; border-left: 1px solid var(--line); }
  .kin-grid { padding: 0.6rem 0 0; }
  .kin-grid::before {
    top: 0; bottom: auto; left: 0; right: 0;
    width: auto; height: 0;
    border-left: 0; border-top: 1px solid var(--line);
    background-image: none;
  }
}

@media (max-width: 40rem) {
  .page { padding: 0.75rem 0.75rem 2rem; }
  .topbar select { margin-left: 0; width: 100%; }
  .running { margin-left: 0; width: 100%; }
  .tokens { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  body { background-image: none; }
  .chip.busy, .chip.active { text-shadow: none; box-shadow: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="notice" id="notice" role="status"></div>
    <select id="project" aria-label="Project"></select>
  </div>
  <main class="sessions" id="sessions"></main>
</div>

<script>
"use strict";

const STORAGE_KEY = "agent-monitor.project";
const FIXTURE_URLS = ["/fixtures/snapshot.json", "../fixtures/snapshot.json"];
const RECONNECT_DELAY_MS = 3000;
const TOKEN_LABELS = [
  ["input", "in"],
  ["output", "out"],
  ["cacheRead", "cache read"],
  ["cacheCreation", "cache write"],
];
const STATUS_LABELS = { waiting: "Waiting", busy: "busy", idle: "idle" };
const STATUS_ORDER = { waiting: 0, busy: 1, idle: 2 };

const SVG_NS = "http://www.w3.org/2000/svg";
const SERIES = [
  ["input", "Input", "input"],
  ["output", "Output", "output"],
  ["cacheRead", "Cache read", "cache-read"],
  ["cacheCreation", "Cache write", "cache-write"],
];
const BAR_RADIUS = 4;
const LABEL_GAP = 4;
const BAR_GEOMETRY = { width: 252, trackStart: 80, trackLength: 100, barHeight: 10, pitch: 12 };
const SPARK_MAX_POINTS = 240;
const SESSION_SPARK = { width: 320, height: 44, left: 46, right: 250, top: 8, bottom: 34 };

const projectSelect = document.getElementById("project");
const notice = document.getElementById("notice");
const sessionList = document.getElementById("sessions");

const fixtureMode = new URLSearchParams(location.search).has("fixture");
let clockSkewMs = 0;
let snapshot = null;
let streamLost = false;
const sparkSeries = new Map();

function now() {
  return Date.now() + clockSkewMs;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, className, attributes, text) {
  const node = document.createElementNS(SVG_NS, tag);
  if (className) node.setAttribute("class", className);
  for (const [attribute, value] of Object.entries(attributes)) node.setAttribute(attribute, String(value));
  if (text !== undefined) node.textContent = text;
  return node;
}

function barPath(x, y, width, height) {
  if (width <= BAR_RADIUS) return `M${x} ${y}h${width}v${height}h${-width}z`;
  const end = x + width;
  return `M${x} ${y}H${end - BAR_RADIUS}a${BAR_RADIUS} ${BAR_RADIUS} 0 0 1 ${BAR_RADIUS} ${BAR_RADIUS}`
    + `V${y + height - BAR_RADIUS}a${BAR_RADIUS} ${BAR_RADIUS} 0 0 1 ${-BAR_RADIUS} ${BAR_RADIUS}H${x}Z`;
}

function readSavedProject() {
  // localStorage throws in some sandboxed contexts; the default project is a fine substitute
  try {
    return localStorage.getItem(STORAGE_KEY);
  } catch (error) {
    return null;
  }
}

function saveProject(cwd) {
  try {
    localStorage.setItem(STORAGE_KEY, cwd);
  } catch (error) {
    console.warn("Could not remember project choice", error);
  }
}

function pad2(value) {
  return String(value).padStart(2, "0");
}

function formatClock(timestamp) {
  const date = new Date(timestamp);
  return `${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}`;
}

function formatElapsed(milliseconds) {
  const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  if (hours > 0) return `${hours}h ${pad2(minutes)}m ${pad2(seconds)}s`;
  if (minutes > 0) return `${minutes}m ${pad2(seconds)}s`;
  return `${seconds}s`;
}

function formatLatency(milliseconds) {
  if (milliseconds === null) return "-";
  if (milliseconds < 1000) return `${Math.round(milliseconds)}ms`;
  if (milliseconds < 60000) return `${(milliseconds / 1000).toFixed(1)}s`;
  return formatElapsed(milliseconds);
}

function formatAgo(timestamp) {
  const seconds = Math.max(0, Math.floor((now() - timestamp) / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  return `${Math.floor(seconds / 3600)}h ago`;
}

function formatCompact(count) {
  const units = [[1e9, "B"], [1e6, "M"], [1e3, "k"]];
  for (const [size, suffix] of units) {
    if (count < size) continue;
    const scaled = count / size;
    const digits = scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2;
    return `${scaled.toFixed(digits)}${suffix}`;
  }
  return String(count);
}

function formatFull(count) {
  return count.toLocaleString("en-US");
}

function sumTokens(tokens) {
  return tokens.input + tokens.output + tokens.cacheRead + tokens.cacheCreation;
}

// subagents write their own transcripts, so their tokens are absent from the parent session's figures
function sumAgentTokens(session) {
  return session.agents.reduce((sum, agent) => sum + sumTokens(agent.tokens), 0);
}

function activeAgentsOf(session) {
  return session.agents.filter((agent) => agent.state === "active");
}

function drawBarRows(svg, rows, geometry) {
  rows.forEach((row, index) => {
    const top = index * geometry.pitch + 1;
    const middle = top + geometry.barHeight / 2;
    svg.append(svgEl("text", "name", { x: 0, y: middle, dy: "0.35em" }, row.label));
    const width = row.value > 0 && row.max > 0 ? Math.max(1, (row.value / row.max) * geometry.trackLength) : 0;
    if (width > 0) {
      svg.append(svgEl("path", `bar ${row.tone}`, { d: barPath(geometry.trackStart, top, width, geometry.barHeight) }));
    }
    const labelX = geometry.trackStart + width + LABEL_GAP;
    svg.append(svgEl("text", "figure", { x: labelX, y: middle, dy: "0.35em" }, formatCompact(row.value)));
  });
}

function buildBarChart(rows, geometry, claim) {
  const height = rows.length * geometry.pitch + 2;
  const svg = svgEl("svg", "chart", { viewBox: `0 0 ${geometry.width} ${height}`, role: "img", "aria-label": claim });
  svg.append(svgEl("line", "axis", { x1: geometry.trackStart, y1: 0, x2: geometry.trackStart, y2: height }));
  const scaleEnd = geometry.trackStart + geometry.trackLength;
  svg.append(svgEl("line", "edge", { x1: scaleEnd, y1: 0, x2: scaleEnd, y2: height }));
  drawBarRows(svg, rows, geometry);
  return svg;
}

function kindMaxima(sessions) {
  const maxima = {};
  for (const [key] of SERIES) {
    maxima[key] = sessions.reduce((best, session) => Math.max(best, session.tokens[key]), 0);
  }
  return maxima;
}

function buildKindBars(session, maxima) {
  const rows = SERIES.map(([key, label, tone]) => ({ label, value: session.tokens[key], max: maxima[key], tone }));
  if (rows.every((row) => row.max === 0)) return el("p", "chart-empty", "No tokens recorded yet");
  const detail = rows.map((row) => `${row.label} ${formatFull(row.value)} of a busiest ${formatFull(row.max)}`).join(", ");
  const claim = `${session.name} against the busiest session for each kind: ${detail}`;
  const chart = buildBarChart(rows, BAR_GEOMETRY, claim);
  chart.setAttribute("class", "chart kind-bars");
  return chart;
}

function buildCompare(session) {
  const sessionTotal = sumTokens(session.tokens);
  const agentTotal = sumAgentTokens(session);
  const max = Math.max(sessionTotal, agentTotal);
  const block = el("div", "compare");
  block.append(el("p", "compare-head", "session vs subagents · same scale"));
  if (max === 0) {
    block.append(el("p", "chart-empty", "No tokens recorded yet"));
    return block;
  }
  const rows = [
    { label: "session", value: sessionTotal, max, tone: "total" },
    { label: "subagents", value: agentTotal, max, tone: "total" },
  ];
  const claim = `${session.name}: ${formatFull(sessionTotal)} tokens in the session itself against ${formatFull(agentTotal)} in its subagents`;
  block.append(buildBarChart(rows, BAR_GEOMETRY, claim));
  return block;
}

function pushSparkPoint(key, value) {
  const series = sparkSeries.get(key) ?? [];
  series.push(value);
  if (series.length > SPARK_MAX_POINTS) series.shift();
  sparkSeries.set(key, series);
}

function recordSparkPoints() {
  const live = new Set();
  for (const session of snapshot.sessions) {
    live.add(session.sessionId);
    pushSparkPoint(session.sessionId, sumTokens(session.tokens));
  }
  for (const key of sparkSeries.keys()) {
    if (!live.has(key)) sparkSeries.delete(key);
  }
}

function sparkY(value, low, high, box) {
  if (high === low) return (box.top + box.bottom) / 2;
  return box.bottom - ((value - low) / (high - low)) * (box.bottom - box.top);
}

function buildSparkChart(series, box, subject, className) {
  const first = series[0];
  const last = series[series.length - 1];
  const low = Math.min(...series);
  const high = Math.max(...series);
  const claim = `${subject}: total tokens across ${series.length} snapshots since this page opened, from ${formatFull(first)} to ${formatFull(last)}`;
  const svg = svgEl("svg", `chart ${className}`, { viewBox: `0 0 ${box.width} ${box.height}`, role: "img", "aria-label": claim });
  svg.append(svgEl("line", "edge", { x1: box.left, y1: box.bottom, x2: box.right, y2: box.bottom }));
  const step = (box.right - box.left) / (series.length - 1);
  const points = series.map((value, index) => `${box.left + index * step} ${sparkY(value, low, high, box)}`);
  svg.append(svgEl("path", "spark-line", { d: `M${points.join("L")}` }));
  svg.append(svgEl("circle", "spark-dot", { cx: box.right, cy: sparkY(last, low, high, box), r: 3 }));
  svg.append(svgEl("text", "figure", { x: box.left - LABEL_GAP, y: sparkY(first, low, high, box), dy: "0.35em", "text-anchor": "end" }, formatCompact(first)));
  svg.append(svgEl("text", "figure", { x: box.right + LABEL_GAP * 2, y: sparkY(last, low, high, box), dy: "0.35em" }, formatCompact(last)));
  return svg;
}

function buildSessionSpark(session) {
  const series = sparkSeries.get(session.sessionId) ?? [sumTokens(session.tokens)];
  if (series.length > 1) return buildSparkChart(series, SESSION_SPARK, session.name, "session-spark");
  const single = el("p", "spark-single");
  single.append(el("b", "", formatCompact(series[0])), document.createTextNode(" tokens so far; the line starts at the second snapshot"));
  return single;
}

function buildChip(kind, label) {
  return el("span", `chip ${kind}`, label);
}

function buildTokenCell(label, count) {
  const cell = el("div", "token");
  cell.append(el("dt", "", label));
  const value = el("dd", "", formatCompact(count));
  value.title = `${formatFull(count)} ${label}`;
  cell.append(value);
  return cell;
}

function buildTokens(session) {
  const list = el("dl", "tokens");
  for (const [key, label] of TOKEN_LABELS) list.append(buildTokenCell(label, session.tokens[key]));
  list.append(buildTokenCell("session total", sumTokens(session.tokens)));
  list.append(buildTokenCell("subagents total", sumAgentTokens(session)));
  return list;
}

function buildFact(label, value) {
  const item = el("li");
  item.append(document.createTextNode(`${label} `), el("span", "value", value));
  return item;
}

function buildFacts(session) {
  const facts = el("ul", "facts");
  facts.append(buildFact("model", session.model ?? "-"));
  facts.append(buildFact("effort", session.effort ?? "-"));
  facts.append(buildFact("branch", session.gitBranch ?? "-"));
  facts.append(buildFact("last turn", formatLatency(session.lastTurnDurationMs)));
  if (session.pendingBackgroundAgents !== null) {
    facts.append(buildFact("background agents pending", String(session.pendingBackgroundAgents)));
  }
  const active = activeAgentsOf(session).length;
  if (active > 0) facts.append(buildFact("active subagents", String(active)));
  return facts;
}

function buildRunning(startedAt) {
  const running = el("span", "running");
  const elapsed = el("b", "", formatElapsed(now() - startedAt));
  elapsed.dataset.elapsedSince = String(startedAt);
  running.append(document.createTextNode(`running since ${formatClock(startedAt)} `), elapsed);
  return running;
}

function buildHeadContent(session) {
  const parts = [];
  parts.push(buildChip(session.status, STATUS_LABELS[session.status]));
  if (session.status === "waiting" && session.waitingFor !== null) {
    const waitingFor = el("span", "waiting-for", session.waitingFor);
    waitingFor.title = session.waitingFor;
    parts.push(waitingFor);
  }
  const name = el("span", "session-name", session.name);
  name.title = session.name;
  parts.push(name);
  const summary = el("span", "summary", session.summary);
  summary.title = session.summary;
  parts.push(summary);
  if (session.currentTurnStartedAt !== null) parts.push(buildRunning(session.currentTurnStartedAt));
  return parts;
}

function buildChartBlock(session, maxima) {
  const block = el("div", "chart-block");
  block.append(el("p", "chart-note", "Total tokens per snapshot · only since this page opened · resets on reload"));
  block.append(buildSessionSpark(session));
  block.append(el("p", "chart-note", "Each kind on its own scale: a full bar is the busiest session for that kind"));
  block.append(buildKindBars(session, maxima));
  return block;
}

function buildSession(session, maxima) {
  const block = el("section", "session");
  const head = el("div", "session-head");
  head.append(...buildHeadContent(session));
  block.append(head);

  const body = el("div", "session-body");
  body.append(buildFacts(session), buildTokens(session));
  body.append(buildChartBlock(session, maxima), buildCompare(session));
  block.append(body);
  return block;
}

function buildAgentMeta(agent) {
  const meta = el("p", "agent-meta");
  const summary = el("span", "summary", agent.summary);
  summary.title = agent.summary;
  meta.append(summary);
  meta.append(el("span", "", agent.model ?? "model -"));
  if (agent.lastActivityAt !== null) {
    const activity = el("span", "", formatAgo(agent.lastActivityAt));
    activity.dataset.agoSince = String(agent.lastActivityAt);
    meta.append(activity);
  }
  return meta;
}

function buildAgentCard(agent) {
  const card = el("li", "agent-card");
  const top = el("div", "agent-top");
  const type = el("span", "agent-type", agent.agentType);
  type.title = agent.agentType;
  top.append(buildChip("active", "active"), type);
  if (agent.spawnDepth > 1) top.append(el("span", "agent-depth", `depth ${agent.spawnDepth}`));
  card.append(top);

  const description = el("p", "agent-desc", agent.description);
  description.title = agent.description;
  card.append(description);
  card.append(buildAgentMeta(agent));

  const total = sumTokens(agent.tokens);
  const totalLine = el("p", "agent-total");
  totalLine.append(el("b", "", formatCompact(total)), document.createTextNode(" tokens"));
  totalLine.title = `${formatFull(total)} tokens`;
  card.append(totalLine);
  return card;
}

function buildKin(session, agents) {
  const kin = el("div", "kin");
  const scroll = el("div", "kin-scroll");
  const list = el("ul", "kin-grid");
  list.setAttribute("aria-label", `Active subagents of ${session.name}`);
  list.append(...agents.map(buildAgentCard));
  scroll.append(list);
  kin.append(scroll);
  return kin;
}

function buildFamily(session, maxima) {
  const agents = activeAgentsOf(session);
  const family = el("div", agents.length > 0 ? "family has-kin" : "family");
  family.append(buildSession(session, maxima));
  if (agents.length > 0) family.append(buildKin(session, agents));
  return family;
}

function compareSessions(first, second) {
  if (first.status !== second.status) return STATUS_ORDER[first.status] - STATUS_ORDER[second.status];
  return second.startedAt - first.startedAt;
}

function pickDefaultProject(projects) {
  return projects.reduce((best, project) => (project.liveSessions > best.liveSessions ? project : best));
}

function selectedProject() {
  const projects = snapshot.projects;
  if (projects.length === 0) return null;
  const saved = projects.find((project) => project.cwd === readSavedProject());
  return saved ?? pickDefaultProject(projects);
}

function syncProjectOptions(project) {
  const signature = snapshot.projects.map((entry) => `${entry.cwd}|${entry.name}|${entry.liveSessions}`).join("\n");
  if (projectSelect.dataset.signature !== signature) {
    projectSelect.dataset.signature = signature;
    projectSelect.replaceChildren(
      ...snapshot.projects.map((entry) => {
        const option = el("option", "", `${entry.name} (${entry.liveSessions} live)`);
        option.value = entry.cwd;
        option.title = entry.cwd;
        return option;
      })
    );
  }
  projectSelect.value = project ? project.cwd : "";
  projectSelect.disabled = !project;
}

function countStatus(sessions, status) {
  return sessions.filter((session) => session.status === status).length;
}

function titlePrefix(counts) {
  if (streamLost) return "(stream lost) ";
  if (counts.waiting > 0) return `(${counts.waiting} waiting) `;
  if (counts.busy > 0) return `(${counts.busy} busy) `;
  return "";
}

function renderTitle(project, counts) {
  document.title = project ? `${titlePrefix(counts)}${project.name}` : "Agent Monitor";
}

function renderNotice() {
  notice.replaceChildren();
  if (streamLost) notice.append(buildChip("lost", "Stream lost, retrying"));
}

function renderEmpty(message) {
  sessionList.replaceChildren(el("div", "empty", message));
}

function render() {
  renderNotice();
  if (!snapshot) {
    document.title = streamLost ? "(stream lost) Agent Monitor" : "Agent Monitor";
    renderEmpty("Waiting for the first snapshot");
    return;
  }
  const project = selectedProject();
  syncProjectOptions(project);
  const sessions = project
    ? snapshot.sessions.filter((session) => session.project === project.name).sort(compareSessions)
    : [];
  renderTitle(project, { waiting: countStatus(sessions, "waiting"), busy: countStatus(sessions, "busy") });
  if (sessions.length === 0) {
    renderEmpty("No live sessions for this project");
    return;
  }
  const maxima = kindMaxima(sessions);
  sessionList.replaceChildren(...sessions.map((session) => buildFamily(session, maxima)));
}

function validateSnapshot(candidate) {
  const valid = candidate && Array.isArray(candidate.projects) && Array.isArray(candidate.sessions)
    && typeof candidate.generatedAt === "number";
  if (!valid) throw new Error("Snapshot is missing generatedAt, projects or sessions");
  return candidate;
}

function applySnapshot(candidate) {
  snapshot = validateSnapshot(candidate);
  if (fixtureMode) clockSkewMs = snapshot.generatedAt - Date.now();
  recordSparkPoints();
  render();
}

function reportProblem(message, error) {
  console.error(message, error);
  renderEmpty(message);
}

function connectStream() {
  const source = new EventSource("/events");
  source.onopen = () => {
    streamLost = false;
    render();
  };
  source.onmessage = (event) => {
    streamLost = false;
    try {
      applySnapshot(JSON.parse(event.data));
    } catch (error) {
      reportProblem("Received a snapshot the page cannot read", error);
    }
  };
  source.onerror = () => {
    streamLost = true;
    render();
    if (source.readyState === EventSource.CLOSED) {
      source.close();
      setTimeout(connectStream, RECONNECT_DELAY_MS);
    }
  };
}

async function fetchFixture() {
  for (const url of FIXTURE_URLS) {
    try {
      const response = await fetch(url);
      if (response.ok) return await response.json();
    } catch (error) {
      console.warn(`Fixture not reachable at ${url}`, error);
    }
  }
  throw new Error("Fixture mode needs the server: could not load /fixtures/snapshot.json");
}

function tickClocks() {
  for (const node of document.querySelectorAll("[data-elapsed-since]")) {
    node.textContent = formatElapsed(now() - Number(node.dataset.elapsedSince));
  }
  for (const node of document.querySelectorAll("[data-ago-since]")) {
    node.textContent = formatAgo(Number(node.dataset.agoSince));
  }
}

projectSelect.addEventListener("change", () => {
  saveProject(projectSelect.value);
  render();
});

setInterval(tickClocks, 1000);
render();

if (fixtureMode) {
  fetchFixture().then(applySnapshot).catch((error) => reportProblem(error.message, error));
} else {
  connectStream();
}
</script>
</body>
</html>
