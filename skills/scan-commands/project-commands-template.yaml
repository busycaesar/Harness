# Project commands: the shell commands this project uses, found by scanning its files.
# A new scan replaces every entry except those with `source: manual`, which it keeps unchanged.
# To add a command by hand, or to keep your edit to one, set its `source` to `manual`.

# One section per app or package. A project with a single app has one section.
sections:
  # The app's name from its manifest, or its folder name.
  - name: <name>
    # The app's folder, relative to the project root; `.` for the root.
    path: <folder>
    # The package manager and the file that shows it. Omitted when none applies.
    package_manager:
      name: <name>
      source: <file>
    # Only categories with evidence appear, in this order.
    commands:
      # One entry per development way, keyed by the name the evidence gives it; `local` runs on the host, without a container.
      dev:
        <way>:
          # Installing dependencies for this way; repeated in each way that shares it.
          install:
            command: <command>
            # Folder to run it from, relative to the project root.
            cwd: <folder>
            # What must be in place first: env vars by name (never their values), files, running services. Omitted when nothing.
            requires:
              - name: <env var name, file or service>
                # Optional, e.g. `copied from .env.example`.
                note: <note>
                source: <file>:<line>
            # `true` when inferred from the project's own files (manifests, lockfiles, entry points); omitted otherwise.
            inferred: true
            # Where it came from: `<file>:<line>`, `<file> <key>`, the files an inferred command rests on, or `manual`.
            source: <file>:<line>
          # Every other <entry> has the same fields as `install`.
          run: <entry>
      # One entry per other way of running, never one meant for development: by the variant the evidence names (e.g. `container`, `prod`), else the task-file script's name.
      run:
        <way>: <entry>
      build: <entry>
      # `file` and `name` only where the test tooling supports them; `{file}` and `{name}` stand for the argument.
      test:
        all: <entry>
        file: <entry>
        name: <entry>
        # Running the tests with coverage measured.
        coverage: <entry>
      lint: <entry>
      format: <entry>
      typecheck: <entry>
      # Any other command found, named by what it does.
      other:
        <short-name>: <entry>
